<!DOCTYPE html>
<html lang="id" class="h-full">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>{{ title }}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">

  <style>
    body { font-family: "Inter", sans-serif; }

    /* Mobile sidebar overlay */
    #sidebar-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.4);
      z-index: 30;
    }
    #sidebar-overlay.active { display: block; }

    /* Sidebar: hidden on mobile, shown on desktop */
    #sidebar {
      position: fixed;
      top: 0; left: 0; bottom: 0;
      width: 240px;
      z-index: 40;
      transform: translateX(-100%);
      transition: transform 0.25s ease;
    }
    #sidebar.open { transform: translateX(0); }

    @media (min-width: 1024px) {
      #sidebar {
        position: relative;
        transform: translateX(0);
        flex-shrink: 0;
      }
      #sidebar-overlay { display: none !important; }
      #mobile-menu-btn { display: none; }
    }
  </style>
</head>

<body class="h-full bg-[#F3F6F3] text-slate-900">
<div class="min-h-screen flex">

  <!-- Overlay for mobile sidebar -->
  <div id="sidebar-overlay" onclick="closeSidebar()"></div>

  <!-- Sidebar -->
  <div id="sidebar" class="bg-white border-r border-slate-200 flex flex-col">
    {% include 'sidebar_admin.html' %}
  </div>

  <main class="flex-1 min-w-0">
    <!-- Mobile top bar -->
    <div class="h-14 bg-white border-b border-slate-200 flex items-center px-4 lg:hidden gap-3 sticky top-0 z-20">
      <button id="mobile-menu-btn"
              onclick="openSidebar()"
              class="p-2 rounded-lg hover:bg-slate-200 transition">
        <i class="fa-solid fa-bars text-slate-600"></i>
      </button>
      <span class="font-extrabold text-sm text-slate-700">{{ title }}</span>
    </div>

    <div class="max-w-3xl mx-auto px-4 sm:px-6 py-6 md:py-8">
      <div class="bg-white rounded-2xl shadow border border-slate-200 p-5 sm:p-8">
        <h1 class="text-xl sm:text-2xl font-extrabold">{{ title }}</h1>
        <p class="text-sm text-slate-500 mt-1">Isi data varietas padi.</p>

        <form method="POST" action="{{ form_action }}" class="mt-6 space-y-4 sm:space-y-5">

          <div>
            <label class="block text-sm font-bold mb-2">Nama Varietas</label>
            <input type="text" name="nama"
                   value="{{ varietas.nama if varietas else '' }}"
                   class="w-full rounded-xl border border-slate-300 px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-400 focus:border-transparent transition"
                   required>
          </div>

          <!-- Two-column grid on sm+ for numeric fields -->
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 sm:gap-5">
            <div>
              <label class="block text-sm font-bold mb-2">Hari Penyemaian</label>
              <input type="number" name="hari_penyemaian"
                     value="{{ varietas.hari_penyemaian if varietas else 0 }}"
                     class="w-full rounded-xl border border-slate-300 px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-400 focus:border-transparent transition"
                     min="0" required>
            </div>

            <div>
              <label class="block text-sm font-bold mb-2">Hari Penanaman</label>
              <input type="number" name="hari_penanaman"
                     value="{{ varietas.hari_penanaman if varietas else '' }}"
                     class="w-full rounded-xl border border-slate-300 px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-400 focus:border-transparent transition"
                     min="0" required>
            </div>

            <div>
              <label class="block text-sm font-bold mb-2">Hari Pemupukan 1</label>
              <input type="number" name="hari_pemupukan_1"
                     value="{{ varietas.hari_pemupukan_1 if varietas and varietas.hari_pemupukan_1 is not none else '' }}"
                     class="w-full rounded-xl border border-slate-300 px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-400 focus:border-transparent transition"
                     min="0">
            </div>

            <div>
              <label class="block text-sm font-bold mb-2">Hari Pemupukan 2</label>
              <input type="number" name="hari_pemupukan_2"
                     value="{{ varietas.hari_pemupukan_2 if varietas and varietas.hari_pemupukan_2 is not none else '' }}"
                     class="w-full rounded-xl border border-slate-300 px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-400 focus:border-transparent transition"
                     min="0">
            </div>
          </div>

          <div>
            <label class="block text-sm font-bold mb-2">Hari Panen</label>
            <input type="number" name="hari_panen"
                   value="{{ varietas.hari_panen if varietas else '' }}"
                   class="w-full rounded-xl border border-slate-300 px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-400 focus:border-transparent transition"
                   min="1" required>
          </div>

          <div class="flex flex-col sm:flex-row gap-3 pt-2">
            <a href="{{ url_for('auth.varietas') }}"
               class="flex-1 sm:flex-none text-center px-5 py-3 rounded-xl bg-slate-200 text-slate-700 font-bold text-sm hover:bg-slate-300 transition">
              Kembali
            </a>
            <button type="submit"
                    class="flex-1 sm:flex-none px-5 py-3 rounded-xl bg-emerald-500 text-white font-bold text-sm hover:brightness-95 transition">
              Simpan
            </button>
          </div>
        </form>
      </div>
    </div>
  </main>

</div>

<script>
  function openSidebar() {
    document.getElementById('sidebar').classList.add('open');
    document.getElementById('sidebar-overlay').classList.add('active');
  }
  function closeSidebar() {
    document.getElementById('sidebar').classList.remove('open');
    document.getElementById('sidebar-overlay').classList.remove('active');
  }
</script>
</body>
</html>
